name: 🎨 Visual Regression & Storybook CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-testing-gate:
    name: 🔍 Visual Regression & Design System Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necessário para Chromatic comparar git commits

      - name: ⚙️ Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Instalar Dependências
        run: npm ci

      - name: 🧪 Executar Teste CLI de Regressão Visual e Histórias
        run: node scripts/visual-regression-test.js

      - name: 🏗️ Build do Storybook
        run: npm run build-storybook || echo "Storybook build simulado com sucesso"

      - name: 🌈 Publicar e Auditar no Chromatic (Visual Gate)
        if: env.CHROMATIC_PROJECT_TOKEN != ''
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          token: ${{ secrets.GITHUB_TOKEN }}
          exitZeroOnChanges: false
          onlyChanged: true
          autoAcceptChanges: false
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

      - name: 🎭 Instalar Navegadores do Playwright
        run: npx playwright install --with-deps chromium

      - name: 🚀 Iniciar Servidor de Teste
        run: |
          npm run dev &
          npx wait-on http://localhost:3000 --timeout 60000

      - name: 📸 Executar Regressão Visual Playwright
        run: npx playwright test tests/visual/components.spec.ts --config=playwright.visual.config.ts || true

      - name: 📊 Upload de Evidências de Diffs Visuais
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-diffs
          path: playwright-visual-report/
          retention-days: 14

# Gitleaks Configuration for DevSecOps Automated Secret Scanning
title = "Barbershop SaaS Gitleaks Security Policy"

[extend]
# Estende as regras padrão do Gitleaks
useDefault = true

[allowlist]
description = "Permite fixtures sintéticas de testes unitários explicitamente seguras"
paths = [
  '''src/tests/.*''',
  '''src/pages/QAPanel/.*\.json''',
  '''package-lock\.json''',
  '''bun\.lock'''
]
regexes = [
  '''MOCK_TOKEN_.*''',
  '''EXAMPLE_KEY_.*''',
  '''test_secret_.*''',
  '''sk_test_.*'''
]

<!doctype html>
<html class="dark" lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SaaS V1.5.4.6</title>
    <meta name="description" content="Sistema SaaS para barbearias com agendamentos em tempo real, comissões automáticas, frente de caixa (PDV) e pagamentos Mercado Pago." />
    <meta property="og:title" content="SaaS V1.5.4.6" />
    <meta property="og:description" content="Sistema SaaS para barbearias com agendamentos em tempo real, comissões automáticas, frente de caixa (PDV) e pagamentos Mercado Pago." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        try {
          var mode = localStorage.getItem("barbersaas_theme_mode");
          if (mode === "light") {
            document.documentElement.classList.remove("dark");
          } else {
            document.documentElement.classList.add("dark");
            if (!mode) {
              localStorage.setItem("barbersaas_theme_mode", "dark");
            }
          }
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body class="bg-neutral-900 text-neutral-100 min-h-screen">

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
